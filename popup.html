<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table Exporter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
      width: 320px;
      min-height: 100px;
    }

    header {
      padding: 12px 16px 10px;
      border-bottom: 1px solid #e8eaed;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #3C41E9;
    }

    header svg { flex-shrink: 0; }

    .content { padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #5f6368;
      margin-bottom: 6px;
    }

    /* Table select */
    #table-select {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      color: #202124;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      outline: none;
    }
    #table-select:focus { border-color: #3C41E9; }

    /* Preview */
    .preview-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .preview-note { font-size: 11px; color: #5f6368; white-space: nowrap; }

    .preview-scroll {
      border: 1px solid #e8eaed;
      border-radius: 6px;
      overflow: auto;
      max-height: 148px;
      background: #fff;
    }
    .preview-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .preview-scroll::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 4px; }

    #preview-table {
      border-collapse: separate;
      border-spacing: 0;
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
      min-width: 100%;
    }
    #preview-table th, #preview-table td {
      padding: 4px 8px;
      text-align: left;
      border-bottom: 1px solid #f1f3f4;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #preview-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8f9fa;
      font-weight: 600;
      color: #3C41E9;
      border-bottom: 1px solid #e8eaed;
    }
    #preview-table tbody tr:last-child td { border-bottom: none; }
    #preview-table tr.excluded th { color: #9aa0a6; text-decoration: line-through; }
    #preview-table td.more { color: #9aa0a6; text-align: center; }
    .preview-empty { padding: 10px; font-size: 11px; color: #5f6368; text-align: center; }

    .table-meta {
      font-size: 11px;
      color: #5f6368;
      margin-top: 4px;
    }

    /* Columns */
    .columns-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .btn-text {
      font-size: 12px;
      color: #3C41E9;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .btn-text:hover { text-decoration: underline; }

    #columns-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #columns-list::-webkit-scrollbar { width: 4px; }
    #columns-list::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 2px; }

    .col-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 4px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .col-item:hover { background: #f1f3f4; }
    .col-item input[type="checkbox"] { accent-color: #3C41E9; cursor: pointer; }
    .col-item span { font-size: 13px; line-height: 1.3; }

    /* Radio groups */
    .radio-group { display: flex; flex-direction: column; gap: 5px; }
    .radio-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 4px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .radio-row:hover { background: #f1f3f4; }
    .radio-row input[type="radio"] { accent-color: #3C41E9; cursor: pointer; }
    .radio-row span { font-size: 13px; }

    /* Placeholder */
    #loading-msg {
      font-size: 13px;
      color: #5f6368;
      text-align: center;
      padding: 16px 0;
    }

    /* Divider */
    hr { border: none; border-top: 1px solid #e8eaed; }

    /* Options group */
    .options-group {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .options-group .section-label { margin-bottom: 4px; }
    .options-group-divider { border: none; border-top: 1px solid #e8eaed; margin: 0; }

    /* Actions */
    footer {
      padding: 10px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-primary {
      background: #3C41E9;
      color: #fff;
      border-color: #3C41E9;
    }
    .btn-primary:hover { background: #3138d4; }

    .btn-secondary {
      background: #fff;
      color: #3C41E9;
      border-color: #dadce0;
    }
    .btn-secondary:hover { background: #f1f3f4; }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #status {
      font-size: 12px;
      min-height: 16px;
      text-align: center;
      color: #5f6368;
    }
    #status.ok { color: #188038; }
    #status.err { color: #d93025; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <img src="icons/icon.svg" width="20" height="20" alt="" style="border-radius:4px;flex-shrink:0;" />
    <h1>Table Exporter</h1>
  </header>

  <div id="loading-msg">Loading table headers…</div>

  <div id="main-content" class="hidden">
    <div class="content">

      <!-- Table Selection -->
      <div>
        <div class="section-label">Table</div>
        <select id="table-select"></select>
        <div class="table-meta" id="table-meta"></div>
      </div>

      <!-- Preview -->
      <div>
        <div class="preview-head">
          <span class="section-label" style="margin-bottom:0;">Preview</span>
          <span class="preview-note" id="preview-note"></span>
        </div>
        <div class="preview-scroll">
          <table id="preview-table"></table>
          <div class="preview-empty hidden" id="preview-empty">Loading preview…</div>
        </div>
      </div>

      <hr />

      <!-- Columns -->
      <div>
        <div class="columns-toolbar">
          <span class="section-label">Columns</span>
          <button class="btn-text" id="toggle-all">Deselect All</button>
        </div>
        <div id="columns-list"></div>
      </div>

      <div id="cell-value-section" style="margin-top:2px;">
        <hr style="margin-bottom:14px;" />
        <!-- Cell Value Mode -->
        <div>
          <div class="section-label">Cell Value</div>
          <div class="radio-group">
            <label class="radio-row">
              <input type="radio" name="mode" value="main" checked />
              <span>Main text only <em id="ex-main" style="color:#5f6368;font-style:normal;"></em></span>
            </label>
            <label class="radio-row">
              <input type="radio" name="mode" value="secondary" />
              <span>Secondary text only <em id="ex-secondary" style="color:#5f6368;font-style:normal;"></em></span>
            </label>
            <label class="radio-row">
              <input type="radio" name="mode" value="both" />
              <span>Both <em id="ex-both" style="color:#5f6368;font-style:normal;"></em></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Options group: Extract + Row Order + CSV Delimiter -->
      <div class="options-group">

        <!-- Extract -->
        <div>
          <div class="section-label">Extract</div>
          <div class="radio-group" style="flex-direction:row;gap:4px 12px;">
            <label class="radio-row" style="padding:2px 4px;">
              <input type="radio" name="extract" value="all" checked />
              <span>Header &amp; Body</span>
            </label>
            <label class="radio-row" style="padding:2px 4px;">
              <input type="radio" name="extract" value="body" />
              <span>Body only</span>
            </label>
          </div>
        </div>

        <hr class="options-group-divider" />

        <!-- Row Order -->
        <div>
          <div class="section-label">Row Order</div>
          <div class="radio-group" style="flex-direction:row;gap:4px 12px;">
            <label class="radio-row" style="padding:2px 4px;">
              <input type="radio" name="order" value="original" checked />
              <span>Original order</span>
            </label>
            <label class="radio-row" style="padding:2px 4px;">
              <input type="radio" name="order" value="reversed" />
              <span>Reversed order</span>
            </label>
          </div>
        </div>

        <hr class="options-group-divider" />

        <!-- CSV Delimiter -->
        <div>
          <div class="section-label">CSV Delimiter</div>
          <div class="radio-group" style="flex-direction:row;flex-wrap:wrap;gap:4px 12px;">
            <label class="radio-row" style="padding:2px 4px;">
              <input type="radio" name="delimiter" value="," checked />
              <span>Comma <em style="color:#5f6368;font-style:normal;">(,)</em></span>
            </label>
            <label class="radio-row" style="padding:2px 4px;">
              <input type="radio" name="delimiter" value=";" />
              <span>Semicolon <em style="color:#5f6368;font-style:normal;">(;)</em></span>
            </label>
            <label class="radio-row" style="padding:2px 4px;">
              <input type="radio" name="delimiter" value="tab" />
              <span>Tab</span>
            </label>
          </div>
        </div>

      </div>

    </div>

    <hr />

    <footer>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-copy-csv">Copy as CSV</button>
        <button class="btn btn-secondary" id="btn-copy-tsv">Copy for Sheets</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-download-csv">Download CSV</button>
        <button class="btn btn-primary" id="btn-download-xls">Download XLS</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-copy-md">Copy as Markdown (for AI chat)</button>
      </div>
      <div id="status"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
